<!DOCTYPE html>
<html>
<head>
    <title>Cart - KBS Bakery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>🛒 Your Cart</h1>

{% if cart %}
    {% for item in cart %}
    <form action="/update/{{ loop.index0 }}" method="POST">
        <p>
            <strong>{{ item.name }}</strong><br>
            Price: ₹{{ item.price }}/kg<br>

            Weight:
            <select name="weight">
                <option value="0.5" {% if item.weight == 0.5 %}selected{% endif %}>0.5 kg</option>
                <option value="1" {% if item.weight == 1 %}selected{% endif %}>1 kg</option>
                <option value="2" {% if item.weight == 2 %}selected{% endif %}>2 kg</option>
            </select>

            Quantity:
            <input type="number" name="quantity" value="{{ item.quantity }}" min="1">

            <br><br>
            Subtotal: ₹{{ item.subtotal }}

            <br><br>
            <button type="submit">Update</button>

            <a href="/remove/{{ loop.index0 }}">
                <button type="button">Remove</button>
            </a>
        </p>
    </form>
    {% endfor %}

    <h2>Total: ₹{{ total }}</h2>

    <a href="/checkout"><button>Checkout</button></a>
{% else %}
    <p>Your cart is empty.</p>
{% endif %}

<br><br>
<a href="/cakes">⬅ Continue Shopping</a>

</body>
</html>
